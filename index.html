<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main>
    <h1>QuickNotes API Client</h1>
    <p class="intro">Talks to the JSONPlaceholder practice API using GET, POST and DELETE.</p>

    <section aria-labelledby="load-heading">
      <h2 id="load-heading">Your notes</h2>
      <button id="load-btn" type="button">Load notes</button>
    </section>

    <p id="status" class="status info" role="status" aria-live="polite"></p>

    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Create a note</h2>
      <form id="note-form" novalidate>
        <label for="title-input">Title (required, max 100 characters)</label>
        <input id="title-input" name="title" type="text" autocomplete="off">

        <label for="body-input">Body (optional)</label>
        <textarea id="body-input" name="body" rows="4"></textarea>

        <button id="submit-btn" type="submit">Add note</button>
      </form>
    </section>

    <ul id="notes-list"></ul>
  </main>
</body>
</html>
